<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Focus Timer</title><h1>Focus Timer</h1><label>Minutes <input id="minutes" type="number" min="1" max="120" value="25"></label><h2 id="clock">25:00</h2><button id="start">Start</button> <button id="pause">Pause</button> <button id="reset">Reset</button><script>
const $=id=>document.getElementById(id);let remaining=1500000,end=0,timer=null;function show(){let s=Math.ceil(remaining/1000);$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}function stop(){clearInterval(timer);timer=null;}function tick(){remaining=Math.max(0,end-Date.now());show();if(!remaining)stop();}function reset(){stop();remaining=Math.max(1,Math.min(120,Number($('minutes').value)||25))*60000;show();}$('start').onclick=()=>{if(timer||!remaining)return;end=Date.now()+remaining;timer=setInterval(tick,200);};$('pause').onclick=()=>{if(timer){tick();stop();}};$('reset').onclick=reset;$('minutes').onchange=reset;</script></html>
